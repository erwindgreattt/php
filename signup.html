<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up - Grainity</title>
  <link rel="icon" type="image/png" href="images/sprout.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="min-vh-100 d-flex align-items-center justify-content-center p-3">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 col-xl-5">
                     <div class="card shadow-lg border-0 rounded-4 position-relative overflow-hidden" style="backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.45); border: 1px solid rgba(113, 201, 101, 0.3);">
            <!-- Enhanced Blob Background - Dynamic Style -->
            <div class="position-absolute top-0 start-0 w-100 h-100" style="z-index: 0;">
              <!-- Large central circle -->
              <div class="position-absolute" style="top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; height: 85%; background: linear-gradient(135deg, #71c965, #2c6a5d, #70c367); border-radius: 50%; opacity: 0.25; filter: blur(1px);"></div>
              <!-- Enhanced accent circles -->
              <div class="position-absolute" style="top: 8%; right: 12%; width: 25%; height: 25%; background: linear-gradient(135deg, #70c367, #71c965); border-radius: 50%; opacity: 0.35; filter: blur(0.5px); animation: pulse 4s ease-in-out infinite;"></div>
              <div class="position-absolute" style="bottom: 12%; left: 8%; width: 20%; height: 20%; background: linear-gradient(135deg, #2c6a5d, #70c367); border-radius: 50%; opacity: 0.4; filter: blur(0.5px); animation: pulse 6s ease-in-out infinite reverse;"></div>
              <!-- Additional floating elements -->
              <div class="position-absolute" style="top: 25%; left: 5%; width: 18%; height: 18%; background: #71c965; border-radius: 50%; opacity: 0.3; animation: float 7s ease-in-out infinite;"></div>
              <div class="position-absolute" style="bottom: 30%; right: 5%; width: 15%; height: 15%; background: #70c367; border-radius: 50%; opacity: 0.25; animation: float 9s ease-in-out infinite reverse;"></div>
              <!-- Organic shapes -->
              <div class="position-absolute" style="top: 60%; left: 15%; width: 12%; height: 20%; background: linear-gradient(45deg, #2c6a5d, #71c965); border-radius: 50% 50% 50% 50% / 60% 40% 60% 40%; opacity: 0.2; transform: rotate(45deg);"></div>
            </div>
            <div class="card-body p-4 p-md-5 position-relative" style="z-index: 1;">
                             <div class="text-center mb-4">
                 <img src="images/sprout.png" alt="Grainity Logo" class="rounded-circle mb-3 shadow-sm" style="width: 60px; height: 60px; object-fit: cover;">
                 <h3 class="fw-bold text-white mb-2">Create Account</h3>
                 <p class="text-white text-opacity-75 small">Join Grainity to streamline your farm management</p>
               </div>
              
              <form>
                                 <div class="row g-3">
                   <div class="col-md-6">
                     <div class="form-floating">
                       <input type="text" class="form-control border-0 bg-light" id="signupFirstName" placeholder="First Name" style="border-radius: 12px;">
                       <label for="signupFirstName" style="color: #2c6a5d;">First Name</label>
                     </div>
                   </div>
                   <div class="col-md-6">
                     <div class="form-floating">
                       <input type="text" class="form-control border-0 bg-light" id="signupLastName" placeholder="Last Name" style="border-radius: 12px;">
                       <label for="signupLastName" style="color: #2c6a5d;">Last Name</label>
                     </div>
                   </div>
                 </div>
                 
                 <div class="form-floating mt-3">
                   <input type="email" class="form-control border-0 bg-light" id="signupEmail" placeholder="name@example.com" style="border-radius: 12px;">
                   <label for="signupEmail" style="color: #2c6a5d;">Email address</label>
                 </div>
                 
                 <div class="row g-3 mt-3">
                                                                                                                                                               <div class="col-md-6">
                                                 <div class="form-floating position-relative">
                           <input type="password" class="form-control border-0 bg-light password-input" id="signupPassword" placeholder="Password" style="border-radius: 12px; padding-right: 50px;">
                           <label for="signupPassword" style="color: #2c6a5d;">Password</label>
                           <button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y me-2 password-toggle-btn" style="z-index: 10; color: #6c757d; text-decoration: none; padding: 0.375rem; cursor: pointer;" onclick="togglePasswordVisibility('signupPassword', 'signupPasswordToggle')">
                             <i class="bi bi-eye password-toggle-icon" id="signupPasswordToggle"></i>
                           </button>
                         </div>
                      </div>
                                                                                                                                                               <div class="col-md-6">
                                                 <div class="form-floating position-relative">
                           <input type="password" class="form-control border-0 bg-light password-input" id="signupConfirm" placeholder="Confirm Password" style="border-radius: 12px; padding-right: 50px;">
                           <label for="signupConfirm" style="color: #2c6a5d;">Confirm Password</label>
                                                       <button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y me-1 password-toggle-btn" style="z-index: 10; color: #6c757d; text-decoration: none; padding: 0.375rem; cursor: pointer;" onclick="togglePasswordVisibility('signupConfirm', 'signupConfirmToggle')">
                              <i class="bi bi-eye password-toggle-icon" id="signupConfirmToggle"></i>
                            </button>
                         </div>
                      </div>
                 </div>
                
                <button type="submit" class="btn btn-success w-100 mt-4 py-3 fw-semibold" style="border-radius: 12px; background: linear-gradient(135deg, #28a745, #20c997); border: none; box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);">
                  Create Account
                </button>
              </form>
              
                             <div class="text-center mt-4">
                 <span class="text-white text-opacity-75 small">Already have an account?</span>
                 <a href="login.html" class="text-white text-decoration-none fw-semibold ms-1">Sign In</a>
               </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
      }
    }
  </script>
</body>
</html>
