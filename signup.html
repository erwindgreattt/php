<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grainity - Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="image/leaf.png">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="login-container signup-page">
    <!-- Back to Home Button -->
    <div class="back-home">
      <a href="index.html" class="back-btn">
        <i class="bi bi-arrow-left me-2"></i>Back to Home
      </a>
    </div>

    <div class="row g-0 h-100">
      <!-- Left Side - Image & Content -->
      <div class="col-lg-6 login-left d-flex align-items-center justify-content-center">
        <div class="login-left-content">
          <h1 class="login-left-title">Join Grainity</h1>
          <p class="login-left-subtitle">
            Start your journey towards smarter, more sustainable farming. Create your account and unlock the power of intelligent agriculture.
          </p>
        </div>
      </div>

      <!-- Right Side - Signup Form -->
      <div class="col-lg-6 d-flex align-items-center justify-content-center">
        <div class="signup-card">
          <!-- Header -->
          <div class="login-header">
            <div class="login-logo">
              <i class="bi bi-leaf"></i>
            </div>
            <h2 class="login-title">Create Account</h2>
            <p class="login-subtitle">Join the future of farming</p>
          </div>

          <!-- Signup Form -->
          <form action="login.html" method="get">
            <div class="row">
              <div class="col-md-6">
                <div class="form-group">
                  <label for="firstName" class="form-label">First Name</label>
                  <input 
                    type="text" 
                    class="form-control" 
                    id="firstName" 
                    placeholder="First name" 
                  >
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group">
                  <label for="lastName" class="form-label">Last Name</label>
                  <input 
                    type="text" 
                    class="form-control" 
                    id="lastName" 
                    placeholder="Last name" 
                  >
                </div>
              </div>
            </div>
            
            <div class="form-group">
              <label for="email" class="form-label">Email Address</label>
              <input 
                type="email" 
                class="form-control" 
                id="email" 
                placeholder="Enter your email address" 
              >
            </div>
            
            <div class="form-group">
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <input 
                  type="password" 
                  class="form-control" 
                  id="password" 
                  placeholder="Create a password" 
                >
                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>
            
            <div class="form-group">
              <label for="confirmPassword" class="form-label">Confirm Password</label>
              <div class="input-group">
                <input 
                  type="password" 
                  class="form-control" 
                  id="confirmPassword" 
                  placeholder="Confirm your password" 
                >
                <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>
            
            <button type="submit" class="btn btn-login">
              <i class="bi bi-person-plus me-2"></i>Create Account
            </button>
          </form>

          <!-- Sign In Section -->
          <div class="signup-section">
            <p class="signup-text">Already have an account?</p>
            <a href="login.html" class="signup-link">
              Sign in to your account
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
