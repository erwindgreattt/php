<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password - Grainity</title>
  <link rel="icon" type="image/png" href="images/sprout.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="min-vh-100 d-flex align-items-center justify-content-center p-3">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 col-xl-5">
                     <div class="card shadow-lg border-0 rounded-4 position-relative overflow-hidden" style="backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.45); border: 1px solid rgba(113, 201, 101, 0.3);">
            <!-- Enhanced Blob Background - Dynamic Wave Style -->
            <div class="position-absolute top-0 start-0 w-100 h-100" style="z-index: 0;">
              <!-- Top wave blob -->
              <div class="position-absolute" style="top: -35%; left: -25%; width: 75%; height: 65%; background: linear-gradient(135deg, #71c965, #2c6a5d); border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%; transform: rotate(-8deg); opacity: 0.4; filter: blur(1px); animation: wave 8s ease-in-out infinite;"></div>
              <!-- Bottom wave blob -->
              <div class="position-absolute" style="bottom: -30%; right: -30%; width: 80%; height: 70%; background: linear-gradient(135deg, #70c367, #71c965); border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%; transform: rotate(12deg); opacity: 0.35; filter: blur(1px); animation: wave 10s ease-in-out infinite reverse;"></div>
              <!-- Enhanced center accent -->
              <div class="position-absolute" style="top: 35%; left: 65%; width: 30%; height: 30%; background: linear-gradient(135deg, #2c6a5d, #70c367); border-radius: 50%; opacity: 0.3; filter: blur(0.5px); animation: pulse 5s ease-in-out infinite;"></div>
              <!-- Floating elements -->
              <div class="position-absolute" style="top: 15%; right: 10%; width: 20%; height: 20%; background: #71c965; border-radius: 50%; opacity: 0.25; animation: float 6s ease-in-out infinite;"></div>
              <div class="position-absolute" style="bottom: 20%; left: 15%; width: 18%; height: 18%; background: #70c367; border-radius: 50%; opacity: 0.2; animation: float 9s ease-in-out infinite reverse;"></div>
              <!-- Organic wave shapes -->
              <div class="position-absolute" style="top: 60%; left: 5%; width: 15%; height: 25%; background: linear-gradient(45deg, #2c6a5d, #71c965); border-radius: 50% 50% 50% 50% / 40% 60% 40% 60%; opacity: 0.15; transform: rotate(-30deg);"></div>
            </div>
            <div class="card-body p-4 p-md-5 position-relative" style="z-index: 1;">
                             <div class="text-center mb-4">
                 <img src="images/sprout.png" alt="Grainity Logo" class="rounded-circle mb-3 shadow-sm" style="width: 60px; height: 60px; object-fit: cover;">
                 <h3 class="fw-bold text-white mb-2">Reset Password</h3>
                 <p class="text-white text-opacity-75 small">Enter your email to receive a password reset link</p>
               </div>
              
              <form>
                                 <div class="form-floating mb-4">
                   <input type="email" class="form-control border-0 bg-light" id="forgotEmail" placeholder="name@example.com" style="border-radius: 12px;">
                   <label for="forgotEmail" style="color: #2c6a5d;">Email address</label>
                 </div>
                
                <button type="submit" class="btn btn-success w-100 py-3 fw-semibold" style="border-radius: 12px; background: linear-gradient(135deg, #28a745, #20c997); border: none; box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);">
                  Send Reset Link
                </button>
              </form>
              
                             <div class="text-center mt-4">
                 <span class="text-white text-opacity-75 small">Remember your password?</span>
                 <a href="login.html" class="text-white text-decoration-none fw-semibold ms-1">Back to Sign In</a>
               </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
