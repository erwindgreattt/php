<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grainity — Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="dashboard-container">
      <!-- Sidebar Toggle Button -->
      <button class="btn btn-outline-success d-md-none m-2 position-fixed sidebar-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarCollapse" aria-expanded="false" aria-controls="sidebarCollapse">
        <i class="bi bi-list"></i>
      </button>

      <!-- Sidebar -->
      <div class="collapse show d-md-block" id="sidebarCollapse">
        <div class="dashboard-sidebar slim">
          <div class="sidebar-header text-center py-3">
            <a href="dashboard.html" class="nav-link p-0" data-bs-toggle="tooltip" data-bs-placement="right" title="Grainity">
              <i class="bi bi-leaf fs-4 text-success"></i>
            </a>
          </div>

          <nav class="sidebar-nav">
            <ul class="nav flex-column align-items-center">
              <li class="nav-item"><a class="nav-link" href="dashboard.html" data-bs-toggle="tooltip" data-bs-placement="right" title="Dashboard"><i class="bi bi-speedometer2"></i></a></li>
              <li class="nav-item"><a class="nav-link" href="farmtask.html" data-bs-toggle="tooltip" data-bs-placement="right" title="Farm Tasks"><i class="bi bi-calendar2-check"></i></a></li>
              <li class="nav-item"><a class="nav-link active" href="profile.html" data-bs-toggle="tooltip" data-bs-placement="right" title="Profile"><i class="bi bi-person"></i></a></li>
              <li class="nav-item"><a class="nav-link" href="settings.html" data-bs-toggle="tooltip" data-bs-placement="right" title="Settings"><i class="bi bi-gear"></i></a></li>
            </ul>
          </nav>

          <div class="sidebar-footer text-center mt-auto pb-3">
            <a class="nav-link logout-link" href="#" id="logoutBtn" data-bs-toggle="tooltip" data-bs-placement="right" title="Logout"><i class="bi bi-box-arrow-right"></i></a>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="dashboard-main">
        <div class="dashboard-header">
          <div class="container-fluid">
            <div class="row align-items-center">
              <div class="col">
                <h1 class="dashboard-title">Profile</h1>
                <p class="dashboard-subtitle">View and manage your account, preferences and recent activity.</p>
              </div>
              <div class="col-auto">
                <button class="btn btn-outline-secondary me-2" data-bs-toggle="modal" data-bs-target="#editProfileModal"><i class="bi bi-pencil-square me-1"></i>Edit</button>
                <button class="btn btn-primary" id="btnMessage"><i class="bi bi-envelope-paper me-1"></i>Message</button>
              </div>
            </div>
          </div>
        </div>

        <div class="dashboard-content">
          <div class="container-fluid">
            <div class="row g-4">
              <!-- Left: Profile banner & overview -->
              <div class="col-lg-4">
                <div class="card dashboard-card">
                  <div class="position-relative">
                    <div class="img-fluid w-100" style="height:140px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); border-top-left-radius: .75rem; border-top-right-radius: .75rem;" alt="banner"></div>
                    <div class="position-absolute" style="bottom:-16px; left:1rem;">
                      <div class="d-flex align-items-center">
                        <img src="https://randomuser.me/api/portraits/men/32.jpg" class="rounded-circle border border-white" style="width:96px; height:96px; object-fit:cover;" alt="avatar">
                        <div class="ms-3">
                          <h5 class="mb-0">John Doe</h5>
                          <small class="text-muted">Farmer</small>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="card-body mt-4 pt-4">
                    <div class="d-flex justify-content-between mb-3">
                      <div>
                        <h6 class="mb-0">Member Since</h6>
                        <small class="text-muted">March 2023</small>
                      </div>
                      <div class="text-end">
                        <h6 class="mb-0">Tasks</h6>
                        <small class="text-muted">128</small>
                      </div>
                    </div>

                    <hr>

                    <h6 class="mb-2">Contact</h6>
                    <p class="mb-1"><i class="bi bi-envelope me-2"></i> john.doe@email.com</p>
                    <p class="mb-1"><i class="bi bi-telephone me-2"></i> +1 234 567 890</p>
                    <p class="mb-0"><i class="bi bi-geo-alt me-2"></i> Farmville, CA</p>

                    <div class="d-grid gap-2 mt-4">
                      <button class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#changePhotoModal"><i class="bi bi-camera me-1"></i>Change Photo</button>
                      <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#editProfileModal"><i class="bi bi-pencil-square me-1"></i>Edit Profile</button>
                    </div>
                  </div>
                </div>

                <!-- Quick Actions removed -->
              </div>

              <!-- Right: Activity & Edit Form -->
              <div class="col-lg-8">
                <!-- About and Recent Activity removed as requested -->

                <div class="card dashboard-card">
                  <div class="card-body">
                    <h5 class="card-title">Public Profile</h5>
                    <form>
                      <div class="mb-3">
                        <label class="form-label">Display name</label>
                        <input class="form-control" value="John Doe">
                      </div>
                      <div class="mb-3">
                        <label class="form-label">Bio</label>
                        <textarea class="form-control" rows="4">Experienced farmer focusing on sustainable grain production.</textarea>
                      </div>
                      <div class="d-flex gap-2">
                        <button class="btn btn-outline-secondary" type="button" data-bs-toggle="modal" data-bs-target="#editProfileModal">Advanced Edit</button>
                        <button class="btn btn-primary" type="submit">Save</button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="editProfileModalLabel"><i class="bi bi-pencil-square me-1"></i>Edit Profile</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form class="row g-3">
              <div class="col-md-6">
                <label class="form-label">First name</label>
                <input class="form-control" value="John">
              </div>
              <div class="col-md-6">
                <label class="form-label">Last name</label>
                <input class="form-control" value="Doe">
              </div>
              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input class="form-control" value="john.doe@email.com" type="email">
              </div>
              <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input class="form-control" value="+1 234 567 890">
              </div>
              <div class="col-12">
                <label class="form-label">Bio</label>
                <textarea class="form-control" rows="4">Experienced farmer focusing on sustainable grain production.</textarea>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary">Save changes</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Change Photo Modal -->
    <div class="modal fade" id="changePhotoModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h6 class="modal-title">Change Photo</h6>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-center">
            <p class="text-muted">Upload a new profile photo (mock UI).</p>
            <input class="form-control" type="file" accept="image/*">
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-success">Upload</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Profile page functionality
      document.addEventListener('DOMContentLoaded', function() {
        // Enable tooltips for slim sidebar
        const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        tooltipTriggerList.forEach(function (el) { new bootstrap.Tooltip(el, { delay: { show: 200, hide: 50 } }); });

        // Check if user is logged in
        if (localStorage.getItem('isLoggedIn') !== 'true') {
          window.location.href = 'login.html';
          return;
        }

        // Logout functionality
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
          logoutBtn.addEventListener('click', function(event) {
            event.preventDefault();
            
            // Clear all login-related data
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userEmail');
            localStorage.removeItem('loginTime');
            localStorage.removeItem('rememberMe');
            localStorage.removeItem('loginAttempts');
            localStorage.removeItem('lastLoginAttempt');
            
            // Show logout confirmation
            const originalText = logoutBtn.innerHTML;
            logoutBtn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Logged Out';
            logoutBtn.style.color = '#10b981';
            
            // Redirect to login page after brief delay
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 1000);
          });
        }
      });
    </script>
  </body>
</html>
