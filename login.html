<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Grainity</title>
  <link rel="icon" type="image/png" href="images/sprout.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="min-vh-100 d-flex align-items-center p-0">
         <!-- Left Side - Floating Image -->
     <div class="col-md-6 d-none d-md-block p-0 position-relative d-flex align-items-center justify-content-center">
       <img src="images/trees.png" alt="Farm Trees" style="width: 100%; height: auto; max-width: 700px;">
     </div>
    
    <!-- Right Side - Login Card -->
    <div class="col-md-6 d-flex align-items-center justify-content-center p-4">
      <div class="w-100" style="max-width: 400px;">
        <div class="card shadow-lg border-0 rounded-4 position-relative overflow-hidden" style="backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.45); border: 1px solid rgba(113, 201, 101, 0.3);">
          <!-- Enhanced Blob Background -->
          <div class="position-absolute top-0 start-0 w-100 h-100" style="z-index: 0;">
            <!-- Top-left green blob -->
            <div class="position-absolute" style="top: -20%; left: -15%; width: 60%; height: 60%; background: linear-gradient(135deg, #71c965, #2c6a5d); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(-15deg); opacity: 0.4; filter: blur(1px);"></div>
            <!-- Bottom-right green blob -->
            <div class="position-absolute" style="bottom: -25%; right: -20%; width: 65%; height: 65%; background: linear-gradient(135deg, #70c367, #71c965); border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; transform: rotate(20deg); opacity: 0.35; filter: blur(1px);"></div>
            <!-- Center accent blob -->
            <div class="position-absolute" style="top: 30%; right: 10%; width: 25%; height: 25%; background: linear-gradient(135deg, #2c6a5d, #70c367); border-radius: 50%; opacity: 0.3; filter: blur(0.5px);"></div>
            <!-- Floating small blobs -->
            <div class="position-absolute" style="top: 15%; left: 5%; width: 15%; height: 15%; background: #71c965; border-radius: 50%; opacity: 0.25; animation: float 6s ease-in-out infinite;"></div>
            <div class="position-absolute" style="bottom: 10%; left: 20%; width: 12%; height: 12%; background: #70c367; border-radius: 50%; opacity: 0.2; animation: float 8s ease-in-out infinite reverse;"></div>
          </div>
          <div class="card-body p-4 p-md-5 position-relative" style="z-index: 1;">
            <div class="text-center mb-4">
              <img src="images/sprout.png" alt="Grainity Logo" class="mb-3 shadow-sm" style="width: 80px; height: 80px; object-fit: contain;">
              <h3 class="fw-bold text-white mb-2">Welcome Back</h3>
              <p class="text-white text-opacity-75 small">Sign in to continue your farming journey</p>
            </div>
            
            <form>
              <div class="form-floating mb-3">
                <input type="email" class="form-control border-0 bg-light" id="loginEmail" placeholder="name@example.com" style="border-radius: 12px;">
                <label for="loginEmail" style="color: #2c6a5d;">Email address</label>
              </div>
              
              <div class="form-floating mb-4 position-relative">
                <input type="password" class="form-control border-0 bg-light password-input" id="loginPassword" placeholder="Password" style="border-radius: 12px; padding-right: 50px;">
                <label for="loginPassword" style="color: #2c6a5d;">Password</label>
                <button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y me-2 password-toggle-btn" style="z-index: 10; color: #6c757d; text-decoration: none; padding: 0.375rem; cursor: pointer;" onclick="togglePasswordVisibility('loginPassword', 'loginPasswordToggle')">
                  <i class="bi bi-eye password-toggle-icon" id="loginPasswordToggle"></i>
                </button>
              </div>
              
              <a href="dashboard.html" class="btn btn-success w-100 py-3 fw-semibold" style="border-radius: 12px; background: linear-gradient(135deg, #28a745, #20c997); border: none; box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);">
                Sign In
              </a>
            </form>
            
            <div class="text-center mt-4">
              <a href="forgot.html" class="text-white text-decoration-none fw-semibold">Forgot password?</a>
            </div>
            
            <div class="text-center mt-4">
              <span class="text-white text-opacity-75 small">Don't have an account?</span>
              <a href="signup.html" class="text-white text-decoration-none fw-semibold ms-1">Create Account</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
      }
    }
  </script>
</body>
</html>
